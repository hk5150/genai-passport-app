<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>生成AIパスポート 模試と全問解説</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0b2e3a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AIパスポート">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="app">

  <div id="homeScreen" class="screen active">
    <div class="appHeader">
      <div class="titleRow">
        <h1>生成AIパスポート</h1>
        <span class="versionBadge" id="versionBadge"></span>
      </div>
      <p>全5章の分野別演習と60分模試。全問解説つき</p>
    </div>
    <div class="statsRow" id="homeStats"></div>

    <div class="sectionLabel">分野別演習</div>
    <div id="chapterList"></div>

    <div class="sectionLabel">力試し</div>
    <button class="primaryBtn" id="mockBtn">
      <span>模擬試験を始める<span class="sub">最大60問・ランダム出題</span></span>
      <span>›</span>
    </button>
    <button class="secondaryBtn" id="reviewBtn">
      <span>間違えた問題を復習 <span class="count"></span></span>
      <span>›</span>
    </button>
    <button class="secondaryBtn" id="explainListBtn">
      <span>間違えた問題の解説を見る <span class="count"></span></span>
      <span>›</span>
    </button>

    <div class="sectionLabel">記録</div>
    <button class="secondaryBtn" id="statsBtn">
      <span>学習データを見る</span>
      <span>›</span>
    </button>

    <!-- 通知はiOSアプリでのみ使えるため、Web版では JS 側で hidden のまま残す -->
    <div class="reminderRow hidden" id="reminderRow">
      <div class="reminderText">
        <span class="reminderLabel">学習リマインダー</span>
        <span class="reminderSub" id="reminderSub">毎日きまった時刻に通知します</span>
      </div>
      <input type="time" id="reminderTime" value="20:00" aria-label="通知する時刻">
      <label class="switch">
        <input type="checkbox" id="reminderToggle" aria-label="学習リマインダーの有効・無効">
        <span class="switchTrack"></span>
      </label>
    </div>
  </div>

  <div id="quizScreen" class="screen">
    <div class="quizTop">
      <div class="quizTopLeft">
        <button class="prevBtn hidden" id="prevBtn">‹ 前へ</button>
        <span class="progressLabel" id="progressLabel"></span>
      </div>
      <div class="quizTopRight">
        <span class="timerLabel" id="timerLabel"></span>
        <button class="quitBtn" id="quitBtn">中断してホームへ</button>
      </div>
    </div>
    <div class="progressBar"><div class="progressFill" id="progressFill"></div></div>
    <div class="tagRow">
      <span class="tag" id="chapTag"></span>
      <span class="tag sec" id="secTag"></span>
    </div>
    <div class="questionText" id="questionText"></div>
    <div id="choices"></div>
    <button class="dontKnowBtn" id="dontKnowBtn">わからない</button>
    <div class="feedback hidden" id="feedback"></div>
    <button class="nextBtn hidden" id="nextBtn">次の問題へ</button>
  </div>

  <div id="resultScreen" class="screen">
    <div class="resultHead">
      <div class="resultScoreNum" id="resultScoreNum"></div>
      <div class="resultPct" id="resultPct"></div>
    </div>
    <div class="sectionLabel">分野別スコア</div>
    <div class="breakdownCard" id="chapBreakdown"></div>
    <div class="sectionLabel">間違えた問題の解説</div>
    <div id="wrongList"></div>
    <div class="resultBtnRow">
      <button class="secondaryBtn" id="homeFromResult">ホームへ</button>
      <button class="primaryBtn" id="retryFromResult"><span>もう一度</span><span>›</span></button>
    </div>
  </div>

  <div id="explainScreen" class="screen">
    <div class="quizTop">
      <span class="progressLabel">間違えた問題の解説</span>
      <button class="quitBtn" id="explainBackBtn">ホームへ</button>
    </div>
    <div id="explainList"></div>
  </div>

  <div id="statsScreen" class="screen">
    <div class="quizTop">
      <span class="progressLabel">学習データ</span>
      <button class="quitBtn" id="statsBackBtn">ホームへ</button>
    </div>
    <div class="statsRow" id="statsHero"></div>
    <div class="sectionLabel">章別の正答率</div>
    <div class="breakdownCard" id="statsChapters"></div>
    <div class="sectionLabel">最近の受験</div>
    <div id="statsHistory"></div>
  </div>

  <!-- confirm()/alert() の代替。WKWebViewのネイティブダイアログはボタンが
       「Cancel」「Ok」と英語で出てしまうため、自前で用意している -->
  <div class="modalOverlay hidden" id="modalOverlay">
    <div class="modalCard" role="dialog" aria-modal="true" aria-labelledby="modalMsg">
      <p class="modalMsg" id="modalMsg"></p>
      <div class="modalBtnRow">
        <button class="modalBtn" id="modalCancel">キャンセル</button>
        <button class="modalBtn primary" id="modalOk">OK</button>
      </div>
    </div>
  </div>

</div>
<script src="./app.js"></script>
<script>
// Service Worker はWeb版(GitHub Pages/PWA)専用。
// Capacitorで動くiOSアプリはアセットをバンドル内から直接配信するためSWは不要で、
// cache-first のSWを噛ませると古いアセットを掴む原因にしかならない。
const isNativeApp = !!(window.Capacitor
  && typeof window.Capacitor.isNativePlatform === 'function'
  && window.Capacitor.isNativePlatform());

if ('serviceWorker' in navigator && !isNativeApp) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch((err) => {
      console.error('SW registration failed:', err);
    });
  });
}
</script>
</body>
</html>
